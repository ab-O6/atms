services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: atms-postgres
    environment:
      POSTGRES_DB: atms
      POSTGRES_USER: atms
      POSTGRES_PASSWORD: atms
    ports:
      - "5432:5432"
    volumes:
      - atms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atms -d atms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  atms_pg_data:
